<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Language Translator</title>
  <style>
    :root {
      --bg1: #eef2ff;
      --bg2: #fdf2f8;
      --card: #ffffff;
      --panel: #f9fafb;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #6366f1;
      --accent2: #8b5cf6;
      --accent-soft: #eef2ff;
      --accent-text: #4338ca;
      --error: #dc2626;
      --shadow: 0 20px 50px rgba(79, 70, 229, 0.18);
    }
    body.dark {
      --bg1: #0f172a;
      --bg2: #1e1b4b;
      --card: #111827;
      --panel: #0b1220;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #1f2937;
      --accent-soft: #1e1b4b;
      --accent-text: #c7d2fe;
      --error: #f87171;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Nirmala UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      transition: background 0.3s;
    }

    .card {
      width: 100%;
      max-width: 980px;
      background: var(--card);
      border-radius: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    /* ---------- Icons ---------- */
    .ic {
      width: 20px; height: 20px;
      fill: none; stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* ---------- Header ---------- */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
    }
    .logo {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: grid; place-items: center;
    }
    .logo .ic { width: 24px; height: 24px; }
    .title { flex: 1; min-width: 0; }
    .title h1 { font-size: 18px; font-weight: 700; }
    .title p { font-size: 13px; opacity: 0.9; }

    .theme-btn {
      width: 40px; height: 40px;
      border: none; border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      color: #fff; cursor: pointer;
      display: grid; place-items: center;
    }
    .theme-btn:hover { background: rgba(255, 255, 255, 0.3); }
    .theme-btn .sun, body.dark .theme-btn .moon { display: none; }
    body.dark .theme-btn .sun { display: block; }

    /* ---------- Language bar ---------- */
    .lang-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      padding: 18px 20px 12px;
    }
    select {
      width: 100%;
      min-width: 0;
      padding: 11px 14px;
      font: inherit; font-size: 15px; font-weight: 600;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
    }
    select option { background: var(--card); color: var(--text); }

    .swap-btn {
      width: 44px; height: 44px;
      border: 1px solid var(--border); border-radius: 50%;
      background: var(--accent-soft); color: var(--accent-text);
      cursor: pointer;
      display: grid; place-items: center;
      transition: transform 0.3s;
    }
    .swap-btn:hover { transform: rotate(180deg); }

    /* ---------- Text panels ---------- */
    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 0 20px;
    }
    .panel {
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    .panel:focus-within { border-color: var(--accent); }

    textarea, .output {
      flex: 1;
      min-height: 220px;
      padding: 16px;
      font: inherit; font-size: 18px; line-height: 1.5;
      color: var(--text);
    }
    textarea {
      width: 100%;
      border: none; outline: none; resize: vertical;
      background: transparent;
    }
    textarea::placeholder { color: var(--muted); }
    .output {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      transition: opacity 0.2s;
    }
    .output.placeholder { color: var(--muted); }
    .output.error { color: var(--error); font-size: 15px; }
    .output.loading { opacity: 0.45; }

    .panel-foot {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 6px 8px 8px;
    }
    .spacer { flex: 1; }
    .muted { color: var(--muted); font-size: 13px; }
    .counter.near-limit { color: var(--error); }

    .tool-btn {
      width: 38px; height: 38px;
      border: none; border-radius: 50%;
      background: transparent; color: var(--muted);
      cursor: pointer;
      display: grid; place-items: center;
    }
    .tool-btn:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent-text); }
    .tool-btn:disabled { opacity: 0.35; cursor: default; }
    .tool-btn .stop, .tool-btn .check,
    .tool-btn.speaking .speaker, .tool-btn.copied .copy { display: none; }
    .tool-btn.speaking .stop, .tool-btn.copied .check { display: block; }
    .tool-btn.speaking, .tool-btn.copied { color: var(--accent-text); background: var(--accent-soft); }

    /* ---------- Translate button ---------- */
    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding: 18px 20px;
    }
    .translate-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 30px;
      border: none; border-radius: 12px;
      font: inherit; font-size: 16px; font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }
    .translate-btn:hover:not(:disabled) { transform: translateY(-1px); }
    .translate-btn:disabled { opacity: 0.7; cursor: wait; }
    .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .translate-btn.busy .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    kbd {
      padding: 1px 6px;
      font: inherit; font-size: 12px;
      border: 1px solid var(--border); border-radius: 5px;
      background: var(--panel);
    }

    .footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
    }

    /* ---------- Toast message ---------- */
    .toast {
      position: fixed;
      left: 50%; bottom: 24px;
      transform: translate(-50%, 20px);
      max-width: calc(100% - 32px);
      padding: 10px 18px;
      border-radius: 10px;
      background: #1f2937; color: #fff;
      font-size: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ---------- Phones ---------- */
    @media (max-width: 720px) {
      body { align-items: flex-start; }
      .panels { grid-template-columns: 1fr; }
      textarea, .output { min-height: 150px; font-size: 17px; }
      .lang-bar { gap: 8px; padding: 14px 16px 10px; }
      .panels, .actions { padding-left: 16px; padding-right: 16px; }
      select { padding: 10px; font-size: 14px; }
      .translate-btn { width: 100%; justify-content: center; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="header">
      <div class="logo">
        <svg class="ic" viewBox="0 0 24 24"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
      </div>
      <div class="title">
        <h1>Language Translator</h1>
        <p>Translate text between {{ languages|length }} languages</p>
      </div>
      <button id="themeBtn" class="theme-btn" title="Toggle dark mode" aria-label="Toggle dark mode">
        <svg class="ic moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="ic sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </header>

    <section class="lang-bar">
      <label class="sr-only" for="source">Translate from</label>
      <select id="source">
        <option value="auto">Detect language</option>
        {% for code, name in languages.items() %}
        <option value="{{ code }}">{{ name }}</option>
        {% endfor %}
      </select>

      <button id="swapBtn" class="swap-btn" title="Swap languages" aria-label="Swap languages">
        <svg class="ic" viewBox="0 0 24 24"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
      </button>

      <label class="sr-only" for="target">Translate to</label>
      <select id="target">
        {% for code, name in languages.items() %}
        <option value="{{ code }}">{{ name }}</option>
        {% endfor %}
      </select>
    </section>

    <section class="panels">
      <div class="panel">
        <label class="sr-only" for="input">Text to translate</label>
        <textarea id="input" dir="auto" maxlength="{{ max_chars }}" placeholder="Type or paste text here..." autofocus></textarea>
        <div class="panel-foot">
          <button id="speakInBtn" class="tool-btn" title="Listen" aria-label="Listen to the original text" disabled>
            <svg class="ic speaker" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            <svg class="ic stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
          <button id="clearBtn" class="tool-btn" title="Clear" aria-label="Clear text" disabled>
            <svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
          <span class="spacer"></span>
          <span id="counter" class="muted counter">0 / {{ max_chars }}</span>
        </div>
      </div>

      <div class="panel">
        <div id="output" class="output placeholder" dir="auto" aria-live="polite">Translation will appear here</div>
        <div class="panel-foot">
          <button id="speakOutBtn" class="tool-btn" title="Listen" aria-label="Listen to the translation" disabled>
            <svg class="ic speaker" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            <svg class="ic stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
          <button id="copyBtn" class="tool-btn" title="Copy translation" aria-label="Copy translation" disabled>
            <svg class="ic copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <svg class="ic check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
          </button>
        </div>
      </div>
    </section>

    <div class="actions">
      <button id="translateBtn" class="translate-btn">
        <span class="spinner"></span>
        <span id="translateLabel">Translate</span>
      </button>
      <span class="muted hint">or press <kbd>Ctrl</kbd> + <kbd>Enter</kbd></span>
    </div>

    <footer class="footer muted">Powered by {{ provider }}</footer>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <script>
    const LANGUAGES = {{ languages | tojson }};

    const $ = (id) => document.getElementById(id);
    const sourceSel = $("source");
    const targetSel = $("target");
    const input = $("input");
    const output = $("output");
    const counter = $("counter");
    const translateBtn = $("translateBtn");
    const speakInBtn = $("speakInBtn");
    const speakOutBtn = $("speakOutBtn");
    const copyBtn = $("copyBtn");
    const clearBtn = $("clearBtn");
    const autoOption = sourceSel.options[0];

    let translation = "";    // the latest translated text
    let detected = null;     // language the API detected for the current input
    let controller = null;   // lets us cancel a request that is still running

    // ---------- Settings remembered in this browser ----------
    function load(key, fallback) {
      try { return localStorage.getItem(key) || fallback; } catch { return fallback; }
    }
    function save(key, value) {
      try { localStorage.setItem(key, value); } catch { /* storage blocked: ignore */ }
    }

    sourceSel.value = load("translator-source", "auto");
    targetSel.value = load("translator-target", "hi");
    if (!sourceSel.value) sourceSel.value = "auto";   // saved code no longer in the list
    if (!targetSel.value) targetSel.value = "hi";

    // ---------- Dark mode ----------
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.body.classList.toggle("dark", load("translator-theme", prefersDark ? "dark" : "light") === "dark");
    $("themeBtn").addEventListener("click", () => {
      const dark = document.body.classList.toggle("dark");
      save("translator-theme", dark ? "dark" : "light");
    });

    // ---------- Small helpers ----------
    let toastTimer;
    function toast(message) {
      const el = $("toast");
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
    }

    function langName(code) {
      return LANGUAGES[code] || code.toUpperCase();
    }

    function setDetected(code) {
      detected = code;
      autoOption.textContent = code ? `Detect language (${langName(code)} detected)` : "Detect language";
    }

    function updateButtons() {
      const hasInput = input.value.trim().length > 0;
      speakInBtn.disabled = !hasInput;
      clearBtn.disabled = input.value.length === 0;
      speakOutBtn.disabled = !translation;
      copyBtn.disabled = !translation;
    }

    function updateCounter() {
      const max = input.maxLength;
      counter.textContent = `${input.value.length} / ${max}`;
      counter.classList.toggle("near-limit", input.value.length > max * 0.9);
    }

    function showOutput(text, kind) {
      // kind: undefined = a translation, "error" = an error message, "empty" = placeholder
      translation = kind ? "" : text;
      output.className = "output" + (kind === "error" ? " error" : kind === "empty" ? " placeholder" : "");
      output.textContent = kind === "empty" ? "Translation will appear here" : text;
      updateButtons();
    }

    function setLoading(on) {
      translateBtn.disabled = on;
      translateBtn.classList.toggle("busy", on);
      $("translateLabel").textContent = on ? "Translating..." : "Translate";
      output.classList.toggle("loading", on);
    }

    // ---------- Translate ----------
    async function translateText() {
      const text = input.value.trim();
      if (!text) {
        showOutput("", "empty");
        toast("Type some text to translate first.");
        input.focus();
        return;
      }

      stopSpeaking();
      if (controller) controller.abort();  // a newer request replaces an older one
      const myController = controller = new AbortController();
      setLoading(true);

      try {
        const res = await fetch("/api/translate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, source: sourceSel.value, target: targetSel.value }),
          signal: myController.signal,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "Something went wrong. Please try again.");

        showOutput(data.text);
        setDetected(sourceSel.value === "auto" ? data.detected : null);
      } catch (err) {
        if (err.name === "AbortError") return;
        const message = err instanceof TypeError
          ? "Can't reach the app server. Is \"python app.py\" still running?"
          : err.message;
        showOutput(message, "error");
      } finally {
        if (controller === myController) {
          controller = null;
          setLoading(false);
        }
      }
    }

    translateBtn.addEventListener("click", translateText);

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        translateText();
      }
    });

    input.addEventListener("input", () => {
      setDetected(null);  // the text changed, so the old detection may be wrong
      updateCounter();
      updateButtons();
    });

    // Changing a language re-translates straight away if there is already a result
    for (const sel of [sourceSel, targetSel]) {
      sel.addEventListener("change", () => {
        save("translator-source", sourceSel.value);
        save("translator-target", targetSel.value);
        if (sel === sourceSel) setDetected(null);
        if (translation) translateText();
      });
    }

    $("swapBtn").addEventListener("click", () => {
      const from = sourceSel.value === "auto" ? detected : sourceSel.value;
      if (!from || !LANGUAGES[from]) {
        toast("Pick a source language first (or translate once so it can be detected).");
        return;
      }
      sourceSel.value = targetSel.value;
      targetSel.value = from;
      save("translator-source", sourceSel.value);
      save("translator-target", targetSel.value);
      setDetected(null);

      if (translation) {
        input.value = translation;  // the translation becomes the new input
        updateCounter();
        translateText();
      }
      updateButtons();
    });

    clearBtn.addEventListener("click", () => {
      stopSpeaking();
      if (controller) controller.abort();
      input.value = "";
      setDetected(null);
      updateCounter();
      showOutput("", "empty");
      input.focus();
    });

    // ---------- Copy ----------
    copyBtn.addEventListener("click", async () => {
      if (!translation) return;
      try {
        await navigator.clipboard.writeText(translation);
      } catch {
        // Older browsers / non-secure pages: copy through a hidden textarea
        const temp = document.createElement("textarea");
        temp.value = translation;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        temp.remove();
      }
      copyBtn.classList.add("copied");
      toast("Translation copied to clipboard");
      setTimeout(() => copyBtn.classList.remove("copied"), 1500);
    });

    // ---------- Text-to-speech (built into the browser, no API key needed) ----------
    const canSpeak = "speechSynthesis" in window;
    const SPEECH_CODES = { tl: "fil" };  // browsers name a few languages differently
    let speechId = 0;  // increases every time speech starts or stops

    if (canSpeak) speechSynthesis.getVoices();  // voices load in the background; this starts it

    function findVoice(code) {
      const want = (SPEECH_CODES[code] || code).toLowerCase();
      const base = want.split("-")[0];
      const voices = speechSynthesis.getVoices();
      const langOf = (v) => v.lang.replace("_", "-").toLowerCase();
      const exact = voices.filter((v) => langOf(v) === want);
      const similar = voices.filter((v) => langOf(v).split("-")[0] === base);
      // Prefer the natural-sounding online voices when there are some
      const pick = (list) => list.find((v) => /natural|online|google/i.test(v.name)) || list[0];
      return pick(exact) || pick(similar) || null;
    }

    // Long text is read in short pieces, because some browsers stop after ~15 seconds
    function splitForSpeech(text) {
      const sentences = text.match(/[^.!?।。！？\n]+[.!?।。！？\n]*/g) || [text];
      const pieces = [];
      let current = "";
      for (const s of sentences) {
        if (current && (current + s).length > 180) {
          pieces.push(current);
          current = "";
        }
        current += s;
      }
      pieces.push(current);
      return pieces.filter((p) => p.trim());
    }

    function resetSpeakButtons() {
      speakInBtn.classList.remove("speaking");
      speakOutBtn.classList.remove("speaking");
    }

    function stopSpeaking() {
      if (!canSpeak) return;
      speechId++;
      speechSynthesis.cancel();
      resetSpeakButtons();
    }

    function speak(text, code, button) {
      if (!canSpeak) {
        toast("Sorry, this browser does not support text-to-speech.");
        return;
      }
      const wasSpeaking = button.classList.contains("speaking");
      stopSpeaking();
      if (wasSpeaking) return;  // clicking again stops the speech

      const voice = findVoice(code);
      if (!voice && speechSynthesis.getVoices().length > 0) {
        toast(`No ${langName(code)} voice on this device. Try Microsoft Edge, or add one in your system's speech settings.`);
        return;
      }

      const id = speechId;
      const pieces = splitForSpeech(text);
      pieces.forEach((piece, i) => {
        const utterance = new SpeechSynthesisUtterance(piece);
        utterance.lang = voice ? voice.lang : (SPEECH_CODES[code] || code);
        if (voice) utterance.voice = voice;
        if (i === pieces.length - 1) {
          utterance.onend = utterance.onerror = () => {
            if (id === speechId) resetSpeakButtons();
          };
        }
        speechSynthesis.speak(utterance);
      });
      button.classList.add("speaking");
    }

    speakInBtn.addEventListener("click", () => {
      const code = sourceSel.value === "auto" ? detected : sourceSel.value;
      if (!code) {
        toast("Pick the source language (or translate once) so the right voice can be used.");
        return;
      }
      speak(input.value, code, speakInBtn);
    });

    speakOutBtn.addEventListener("click", () => speak(translation, targetSel.value, speakOutBtn));

    updateCounter();
    updateButtons();
  </script>
</body>
</html>
